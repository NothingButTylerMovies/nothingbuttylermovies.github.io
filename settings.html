<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | NothingButTyler Movies</title>

<script src="https://kit.fontawesome.com/eeb01edac2.js"
crossorigin="anonymous"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap"
rel="stylesheet">

<style>

:root {
    --ice-blue: #38bdf8;
    --onyx: #05070a;
    --glass: rgba(56, 189, 248, 0.03);
    --glass-border: rgba(56, 189, 248, 0.15);
    --cinema-glow: 0 0 25px rgba(56, 189, 248, 0.3);
}

/* BASE */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--onyx);
    color: white;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}

/* NAV */

nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 9999;

    background: rgba(5,7,10,0.85);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid var(--glass-border);
}

.nav-container {

    max-width: 1400px;

    margin: 0 auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 40px;
}

.nav-brand {

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;

    display: flex;

    align-items: center;

    gap: 12px;
}

.nav-brand i {
    color: var(--ice-blue);
}

.nav-links {

    display: flex;

    gap: 20px;

    align-items: center;
}

.btn-main-site {

    border: 1px solid var(--ice-blue);

    padding: 8px 18px;

    border-radius: 4px;

    color: var(--ice-blue);

    font-size: 0.7rem;

    font-weight: 800;

    text-transform: uppercase;
}

.btn-main-site:hover {

    background: var(--ice-blue);

    color: black;
}

/* HERO */

.hero {

    min-height: 60vh;

    display: flex;

    align-items: center;

    padding-top: 100px;

    background:
    linear-gradient(
        to top,
        var(--onyx) 15%,
        rgba(5,7,10,0.7)
    ),

    url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&q=80&w=2000')
    center/cover;
}

.hero-content {

    max-width: 1200px;

    margin: 0 auto;

    padding: 40px;
}

.badge {

    background: var(--ice-blue);

    color: black;

    padding: 4px 12px;

    border-radius: 4px;

    font-size: 0.7rem;

    font-weight: 900;

    text-transform: uppercase;
}

.hero-title {

    font-size: clamp(3rem, 10vw, 6rem);

    font-weight: 900;

    margin: 20px 0 10px;

    line-height: 0.9;

    letter-spacing: -4px;
}

.hero-desc {

    max-width: 650px;

    opacity: 0.8;

    font-size: 1.1rem;
}

/* SETTINGS */

.settings-grid {

    max-width: 1200px;

    margin: 0 auto;

    padding: 40px;

    display: grid;

    gap: 30px;
}

.settings-card {

    background: var(--glass);

    border: 1px solid var(--glass-border);

    border-radius: 24px;

    padding: 30px;

    backdrop-filter: blur(10px);

    box-shadow: var(--cinema-glow);
}

.settings-card h2 {

    margin-top: 0;

    margin-bottom: 25px;

    display: flex;

    align-items: center;

    gap: 12px;
}

.profile-section {

    display: flex;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;
}

.profile-section img {

    width: 90px;

    height: 90px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid var(--ice-blue);
}

.profile-section h3 {

    margin: 0;
}

.profile-section p {

    opacity: 0.7;
}

/* BUTTON */

.settings-btn {

    padding: 14px 20px;

    border-radius: 14px;

    border: 1px solid var(--glass-border);

    background: rgba(255,255,255,0.05);

    color: white;

    font-weight: 700;

    cursor: pointer;

    transition: 0.25s ease;
}

.settings-btn:hover {

    border-color: var(--ice-blue);

    color: var(--ice-blue);

    box-shadow: var(--cinema-glow);
}

/* SETTING ROW */

.setting-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 18px 0;

    border-bottom: 1px solid rgba(255,255,255,0.06);
}

/* SWITCH */

.switch {

    position: relative;

    width: 55px;

    height: 30px;
}

.switch input {

    opacity: 0;
}

.slider {

    position: absolute;

    inset: 0;

    background: rgba(255,255,255,0.15);

    border-radius: 999px;

    transition: 0.25s ease;

    cursor: pointer;
}

.slider::before {

    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    left: 4px;
    top: 4px;

    background: white;

    border-radius: 50%;

    transition: 0.25s ease;
}

.switch input:checked + .slider {

    background: var(--ice-blue);
}

.switch input:checked + .slider::before {

    transform: translateX(25px);
}

/* PROFILE BUTTON */

#profile-btn {

    width: 45px;
    height: 45px;

    border-radius: 50%;

    overflow: hidden;

    border: 1px solid var(--glass-border);

    background: rgba(255,255,255,0.04);

    cursor: pointer;
}

#profile-btn img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* USER MENU */

#user-menu {

    position: fixed;

    top: 80px;
    right: 30px;

    width: 220px;

    background: rgba(5,7,10,0.98);

    border: 1px solid var(--glass-border);

    border-radius: 18px;

    padding: 10px;

    display: none;

    flex-direction: column;

    gap: 8px;

    box-shadow: var(--cinema-glow);

    z-index: 999999;
}

#user-menu.active {
    display: flex;
}

#user-menu button {

    width: 100%;

    background: rgba(255,255,255,0.04);

    border: none;

    color: white;

    padding: 12px;

    border-radius: 12px;

    display: flex;

    align-items: center;

    gap: 10px;

    cursor: pointer;
}

#user-menu button:hover {

    border: 1px solid var(--ice-blue);

    color: var(--ice-blue);
}

/* MOBILE */

@media (max-width: 768px) {

    .nav-container {
        padding: 15px 25px;
    }

    .hero-content {
        padding: 30px;
    }

    .settings-grid {
        padding: 25px;
    }

    .profile-section {

        flex-direction: column;

        text-align: center;
    }
}

</style>
</head>
<body>

<nav>

    <div class="nav-container">

        <a href="/"
        class="nav-brand">

            <i class="fa-solid fa-clapperboard"></i>

            NOTHINGBUTTYLER MOVIES

        </a>

        <div class="nav-links">

            <a href="/watchlist"
            class="btn-main-site">

                Watchlist

            </a>

            <button id="profile-btn"
            onclick="toggleUserMenu()">

                <i class="fa-solid fa-user"></i>

            </button>

        </div>

    </div>

</nav>

<div id="user-menu">

    <button onclick="location.href='/watchlist'">

        <i class="fa-solid fa-bookmark"></i>

        Watchlist

    </button>

    <button onclick="location.href='/settings'">

        <i class="fa-solid fa-gear"></i>

        Settings

    </button>

    <button onclick="logoutUser()">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </button>

</div>

<section class="hero">

    <div class="hero-content">

        <span class="badge">
            ACCOUNT CENTER
        </span>

        <h1 class="hero-title">
            SETTINGS
        </h1>

        <p class="hero-desc">
            Customize your NothingButTyler Movies experience.
        </p>

    </div>

</section>

<div class="settings-grid">

    <!-- PROFILE -->

    <div class="settings-card">

        <h2>

            <i class="fa-solid fa-user"></i>

            Profile

        </h2>

        <div class="profile-section">

            <img id="settings-avatar"
            src=""
            alt="Profile">

            <div>

                <h3 id="settings-name">
                    Loading...
                </h3>

                <p id="settings-email">
                    Loading...
                </p>

            </div>

        </div>

        <button class="settings-btn"
        onclick="logoutUser()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

    <!-- PLAYBACK -->

    <div class="settings-card">

        <h2>

            <i class="fa-solid fa-play"></i>

            Playback

        </h2>

        <div class="setting-row">

            <span>Autoplay Next Episode</span>

            <label class="switch">

                <input type="checkbox"
                id="autoplay-toggle">

                <span class="slider"></span>

            </label>

        </div>

        <div class="setting-row">

            <span>Volume Memory</span>

            <label class="switch">

                <input type="checkbox"
                id="volume-toggle">

                <span class="slider"></span>

            </label>

        </div>

        <div class="setting-row">

            <span>Skip Intro Automatically</span>

            <label class="switch">

                <input type="checkbox"
                id="intro-toggle">

                <span class="slider"></span>

            </label>

        </div>

    </div>

    <!-- APPEARANCE -->

    <div class="settings-card">

        <h2>

            <i class="fa-solid fa-palette"></i>

            Appearance

        </h2>

        <div class="setting-row">

            <span>Cinematic Mode</span>

            <label class="switch">

                <input type="checkbox"
                id="cinematic-toggle">

                <span class="slider"></span>

            </label>

        </div>

        <div class="setting-row">

            <span>Reduced Motion</span>

            <label class="switch">

                <input type="checkbox"
                id="motion-toggle">

                <span class="slider"></span>

            </label>

        </div>

    </div>

</div>

<footer style="
padding:60px 20px;
text-align:center;
border-top:1px solid var(--glass-border);
opacity:0.5;
font-size:0.7rem;
letter-spacing:2px;
">

    NOTHINGBUTTYLER MOVIES © 2026

</footer>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
CREATE CLIENT
========================= */

const supabaseClient =
window.supabase.createClient(

    "https://dqxtenfrlkqxpuuziyhj.supabase.co",

    "sb_publishable_wbkLEBb4-NS6VWmQLznbtw_eTWEaSRa"
);

/* =========================
CHECK USER
========================= */

async function checkUser() {

    const {
        data: { session }
    } =
    await supabaseClient.auth.getSession();

    if (!session) {

        window.location.href = "/";

        return;
    }

    const user = session.user;

    /* TOP PROFILE BUTTON */

    const profileBtn =
    document.getElementById("profile-btn");

    profileBtn.innerHTML = `

        <img
        src="${user.user_metadata.avatar_url}"
        alt="Profile">

    `;

    /* SETTINGS PROFILE */

    document.getElementById(
        "settings-avatar"
    ).src =
    user.user_metadata.avatar_url;

    document.getElementById(
        "settings-name"
    ).textContent =

    user.user_metadata.full_name ||
    user.user_metadata.name ||
    "Creator";

    document.getElementById(
        "settings-email"
    ).textContent =
    user.email;
}

/* =========================
MENU
========================= */

function toggleUserMenu() {

    document
    .getElementById("user-menu")
    .classList.toggle("active");
}

/* =========================
LOGOUT
========================= */

async function logoutUser() {

    await supabaseClient.auth.signOut();

    localStorage.removeItem("nbtm-user");

    window.location.href = "/";
}

/* =========================
CLICK OUTSIDE
========================= */

document.addEventListener(
"click",
function (e) {

    const menu =
    document.getElementById(
        "user-menu"
    );

    const profileBtn =
    document.getElementById(
        "profile-btn"
    );

    const clickedInsideMenu =
    menu.contains(e.target);

    const clickedProfile =
    profileBtn.contains(e.target);

    if (
        !clickedInsideMenu &&
        !clickedProfile
    ) {

        menu.classList.remove(
            "active"
        );
    }
});

/* =========================
SETTINGS SAVE
========================= */

const settingIds = [

    "autoplay-toggle",
    "volume-toggle",
    "intro-toggle",
    "cinematic-toggle",
    "motion-toggle"
];

settingIds.forEach(id => {

    const toggle =
    document.getElementById(id);

    /* LOAD */

    const saved =
    localStorage.getItem(id);

    if (saved === "true") {

        toggle.checked = true;
    }

    /* SAVE */

    toggle.addEventListener(
    "change",

    () => {

        localStorage.setItem(
            id,
            toggle.checked
        );
    });
});

/* =========================
RUN
========================= */

window.addEventListener(
"load",

() => {

    checkUser();

});

</script>

</body>
          </html>
