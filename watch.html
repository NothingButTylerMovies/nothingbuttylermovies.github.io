<body>
    
<div class="player-container" id="video-wrapper">
    <div id="ad-overlay">
        <div id="loader-wrapper" class="loader-wrapper">
            <div class="loader"></div>
        </div>

        <div id="ad-content">
            <video id="ad-video" playsinline preload="auto"></video>
            <div id="ad-label">ADVERTISEMENT</div>
            <div id="play-hint">TAP TO WATCH AD</div>
            <div id="play-icon-hint"><i class="fa-solid fa-play"></i></div>
        </div>

        <div id="ad-timer-container">
            <svg class="timer-svg" viewBox="0 0 80 80">
                <circle class="timer-bg" cx="40" cy="40" r="35"/>
                <circle id="timer-progress" cx="40" cy="40" r="35"/>
            </svg>
            <span id="ad-timer">0</span>
        </div>
    </div>

    <video id="main-player"></video>

    <div class="video-overlay-top" id="overlay-top">
        <div style="display: flex; align-items: center; gap: 20px;">
            <a href="/info" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="episode-details">
                <span id="mini-show-title">JENNA AND TUBERS</span>
                <h1 id="large-episode-title">S1E1: The Visitor</h1>
            </div>
        </div>
        <button onclick="toggleSettings()" id="settings-gear-btn">
            <i class="fa-solid fa-gear"></i>
        </button>
    </div>

    <div class="video-controls" id="controls">
        <div class="progress-area" id="progress-bar-container">
            <div class="progress-filled" id="progress-fill"></div>
        </div>
        <div class="control-buttons">
            <button onclick="togglePlay()"><i id="play-icon" class="fa-solid fa-play"></i></button>
            <span id="time-display">0:00 / 0:00</span>
            <div class="right-group">
                <button onclick="toggleCaptions()"><i class="fa-solid fa-closed-captioning"></i></button>
                <button onclick="goFullScreen()"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>
    </div>
</div>

    <script>
const AD_URL = "https://nothingbuttylermovies.github.io/videos/ads/lv_0_20260126153800%20(1)%20(1).mp4";
const MOVIE_URL = "https://nothingbuttylermovies.github.io/videos/JennaAndTubers/Jenna and Tubers - Mini TV show - episode 1 #shortvideo #roblox.mp4";
const CIRCUMFERENCE = 220;

const mainPlayer = document.getElementById('main-player');
const adVideo = document.getElementById('ad-video');
const adOverlay = document.getElementById('ad-overlay');
const loader = document.getElementById('loader-wrapper');
const playHint = document.getElementById('play-hint');
const iconHint = document.getElementById('play-icon-hint');
const timerText = document.getElementById('ad-timer');
const timerProgress = document.getElementById('timer-progress');
const timerContainer = document.getElementById('ad-timer-container');
const controls = document.getElementById('controls');
const overlayTop = document.getElementById('overlay-top');
const playIcon = document.getElementById('play-icon');
const timeDisplay = document.getElementById('time-display');
const progressContainer = document.getElementById('progress-bar-container');
const progressFill = document.getElementById('progress-fill');
const wrapper = document.getElementById('video-wrapper');

let adsFinished = false;
let userStartedMovie = false;

function initTheater() {
    loader.style.opacity = '1';
    adOverlay.style.display = 'flex';
    adVideo.src = AD_URL;
    adVideo.load();
    mainPlayer.src = MOVIE_URL;
    mainPlayer.preload = 'metadata';

    setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 400);

        playHint.style.display = 'block';
        iconHint.style.display = 'block';
    }, 500);
}

// Single click handler for everything
function startPlayback() {
    playHint.style.display = 'none';
    iconHint.style.display = 'none';

    mainPlayer.muted = true;
    mainPlayer.style.display = 'block';
    mainPlayer.play().catch(err => console.warn("Main play blocked:", err));

    adOverlay.style.display = 'flex';
    adVideo.muted = true;
    adVideo.style.display = 'block';
    timerContainer.style.display = 'flex';
    adVideo.play().catch(err => console.warn("Ad play blocked:", err));

    adVideo.addEventListener('ended', () => {
        adsFinished = true;
        adOverlay.style.display = 'none';
        mainPlayer.muted = false;
        controls.classList.add('active');
        overlayTop.classList.add('active');
    }, { once: true });

    playHint.removeEventListener('click', startPlayback);
    iconHint.removeEventListener('click', startPlayback);
}

// Timer update
adVideo.addEventListener('loadedmetadata', () => timerText.textContent = Math.ceil(adVideo.duration));
adVideo.addEventListener('timeupdate', () => {
    if (!adVideo.duration) return;
    const remaining = Math.ceil(adVideo.duration - adVideo.currentTime);
    timerText.textContent = remaining;
    const progress = adVideo.currentTime / adVideo.duration;
    timerProgress.style.strokeDashoffset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
    if (remaining <= 5) timerContainer.classList.add('timer-danger');
});

// Main video events
mainPlayer.addEventListener('play', () => playIcon.className = 'fa-solid fa-pause');
mainPlayer.addEventListener('pause', () => playIcon.className = 'fa-solid fa-play');
mainPlayer.addEventListener('loadedmetadata', () => timeDisplay.textContent = `0:00 / ${formatTime(mainPlayer.duration)}`);
mainPlayer.addEventListener('timeupdate', () => {
    if (!mainPlayer.duration) return;
    const percent = (mainPlayer.currentTime / mainPlayer.duration) * 100;
    progressFill.style.width = percent + '%';
    timeDisplay.textContent = `${formatTime(mainPlayer.currentTime)} / ${formatTime(mainPlayer.duration)}`;
});
progressContainer.addEventListener('click', e => {
    const rect = progressContainer.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    mainPlayer.currentTime = percent * mainPlayer.duration;
});

function formatTime(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${s.toString().padStart(2,'0')}`; }
function togglePlay() { if (mainPlayer.paused) mainPlayer.play().catch(err=>console.error("Play failed:", err)); else mainPlayer.pause(); }
function goFullScreen() { if(document.fullscreenElement){document.exitFullscreen();}else{wrapper.requestFullscreen().catch(()=>console.warn("Fullscreen failed"));}}
document.addEventListener('keydown', e => { if(e.target.tagName==='INPUT') return; if(e.code==='Space'){e.preventDefault();togglePlay();} if(e.code==='ArrowRight') mainPlayer.currentTime+=5; if(e.code==='ArrowLeft') mainPlayer.currentTime-=5; if(e.code==='KeyF') goFullScreen(); });

// START EVERYTHING on click
playHint.addEventListener('click', startPlayback);
iconHint.addEventListener('click', startPlayback);
    
    playHint.addEventListener('click', startPlayback);
playHint.addEventListener('touchend', startPlayback);
iconHint.addEventListener('click', startPlayback);
iconHint.addEventListener('touchend', startPlayback);

window.addEventListener('load', initTheater);
</script>
