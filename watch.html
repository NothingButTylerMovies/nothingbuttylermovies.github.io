<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch {Episode_Name} | NothingButTyler Movies</title>
  <script src="https://kit.fontawesome.com/eeb01edac2.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ice-blue: #38bdf8;
      --accent-main: var(--ice-blue);
      --accent-glow: rgba(56,189,248,0.6);
    }
    body.theme-red { --accent-main: #ff4d4d; --accent-glow: rgba(255,77,77,0.6); }
    body.theme-green { --accent-main: #00ff88; --accent-glow: rgba(0,255,136,0.6); }

    body { margin:0; font-family:'Inter', sans-serif; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; min-height:100vh; overflow:hidden; }
    html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

    video { width:100%; height:100%; object-fit:contain; position:absolute; top:0; left:0; }

    /* AD OVERLAY */
    #ad-overlay { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; z-index:2000; justify-content:center; align-items:center; pointer-events:auto; }
    #ad-content { position:relative; width:100%; height:100%; display:flex; justify-content:center; align-items:center; }

    #ad-video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      background: black; 
      position: absolute; 
      top: 0;             
      left: 0;            
      z-index: 10;        
    }

    #ad-timer-container { position:absolute; bottom:30px; right:30px; width:65px; height:65px; background:#2a2a2a; border-radius:50%; display:flex; justify-content:center; align-items:center; z-index:5000; border:3px solid #1a1a1a; }
    .timer-svg { width:100%; height:100%; transform:rotate(-90deg); }
    .timer-bg { fill: rgba(0,0,0,0.4); stroke: rgba(255,255,255,0.1); stroke-width:8; }
    #timer-progress { fill:none; stroke:var(--accent-main); stroke-width:8; stroke-dasharray:220; stroke-dashoffset:220; transition:stroke-dashoffset 0.1s linear; }
    #ad-timer { position:absolute; font-size:1.4rem; font-weight:900; color:white; }

    #ad-play-container {
      position: absolute;
      bottom: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-main);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      z-index: 9000;
    }
    #ad-play-container i { font-size: 1.6rem; }
    #ad-play-container:hover { transform: scale(1.05); }

    /* CONTROLS */
    .player-container { width:100vw; height:100svh; position:relative; overflow:hidden; background:#000; }
    .video-controls, .video-overlay-top { position:absolute; width:100%; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:5000; }
    .video-controls.active, .video-overlay-top.active { opacity:1; pointer-events:auto; }

    .video-overlay-top { top:0; flex-direction:row; justify-content:/*flex-start*/ space-between; gap:20px; padding:10px; align-items: center; }
    .back-btn { color:white; text-decoration:none; font-size:1.5rem; width:45px; height:45px; display:flex; justify-content:center; align-items:center; border-radius:50%; background:rgba(255,255,255,0.1); transition:0.3s; }
    .back-btn:hover { background:var(--accent-main); }

    .episode-details { margin-left:20px; }
    #mini-show-title { color:var(--accent-main); font-weight:900; text-transform:uppercase; font-size:0.75rem; letter-spacing:2px; }
    #large-episode-title { font-size:1.2rem; margin:0; text-shadow:2px 2px 4px rgba(0,0,0,0.8); }

    .control-buttons { display:flex; justify-content:/*space-between*/ flex-start; align-items:center; width:100%; gap:14px; }
    .right-group { margin-left: auto; display:flex; gap:14px; flex-shrink:0; }
    .control-buttons button { background:none; border:none; color:var(--accent-main); font-size:1.8rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.2s ease, filter 0.3s ease; }
    .control-buttons button:hover { transform:scale(1.1); filter:drop-shadow(0 0 10px var(--accent-main)); }
    #time-display { font-size:1rem; font-weight:700; color:white; margin-left:10px; }

    .progress-area {
  width: 100%;
  height: 6px;
  display: flex;
  align-items: center;
      margin-bottom: 2px;
}  
  .progress-filled { height:100%; width:0%; background:var(--accent-main); border-radius:10px; }

    /* SETTINGS MENU */
    #settings-menu { 
      display: none; 
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%,-50%); 
      width: 90%;
      max-width: 400px;
      background: rgba(5,7,10,0.95); 
      padding: 50px 20px 25px; 
      border-radius: 20px; 
      border: 2px solid var(--accent-main); 
      z-index: 10000; 
      flex-direction: column;
      align-items: center;
    }
    #settings-menu.visible { display: flex !important; }
    
    #settings-close-btn { position:absolute; top:0; right:0; font-size:1.8rem; color:var(--accent-main); background:none; border:none; cursor:pointer; z-index:10001; }
    #settings-menu button { width:90%; font-size:0.9rem; padding:10px 12px; margin-bottom:10px; color:var(--accent-main); border:2px solid var(--accent-main); border-radius:12px; background:rgba(0,0,0,0.8); font-weight:700; cursor:pointer; box-shadow:0 0 15px var(--accent-glow); }
    #settings-menu button:hover { background:var(--accent-main); color:#000; box-shadow:0 0 25px var(--accent-glow); }

    @media (max-width:768px) {
      #settings-menu { width: 85%; max-height: 80vh; padding: 20px; }
    }

    /* PLAY ICON FORCE COLOR */
    #play-icon, button i { color:var(--accent-main) !important; }

    /* MAIN PLAYER FIXES */
    #main-player {
      display: block !important;
      z-index: 1;
    }

}

#ad-controls button {
  background: none;

  #end-screen {
  position: absolute;
  width: 100%;

  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.end-content h1 {

}

.end-buttons {
  margin-top: 20px;

}

.end-buttons button {
  padding: 10px 16px;

}

.end-buttons button:first-child {

}

.end-buttons button:last-child {

}
  
  #skip-buttons {
  opacity: 0;
  transition: opacity 0.3s ease;
    z-index: 9000;
}
#skip-buttons.show {
  opacity: 1;
}
  
  #skip-buttons button {
  background: rgba(0,0,0,0.8);
  border: 2px solid var(--accent-main);
  color: var(--accent-main);
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: bold;
}
  
  #caption-settings-menu {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  width: 90%;
  max-width: 400px;
  background: rgba(5,7,10,0.98);
  padding: 50px 20px 25px;
  border-radius: 20px;
  border: 2px solid var(--accent-main);
  z-index: 11000; /* Higher than the main settings */
  flex-direction: column;
  align-items: center;
}

.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 90%;
}

#caption-settings-close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 1.8rem;
  color: var(--accent-main);

  cursor: pointer;
}

  video::cue {
  font-size: 16px;

  </style>

<body>
<div class="player-container" id="video-wrapper">
  
  <div id="loading-screen">
  <div class="loader"></div>
</div>

  <div id="ad-overlay">
    <div id="ad-content">
      <video id="ad-video" playsinline preload="auto"></video>
      <div id="ad-play-container">
        <i class="fa-solid fa-play"></i>
        <span>TAP TO WATCH AD</span>
      </div>      
      
      <div id="ad-controls">
  <button onclick="toggleAdPlay()"><i id="ad-play-icon" class="fa-solid fa-play"></i></button>
  <button onclick="adFullScreen()"><i class="fa-solid fa-expand"></i></button>
</div>
      
      <div id="ad-timer-container" style="display: none;">
        <svg class="timer-svg" viewBox="0 0 80 80">
          <circle class="timer-bg" cx="40" cy="40" r="35"></circle>

<script>
const AD_URL = "https://nothingbuttylermovies.github.io/videos/ads/lv_0_20260126153800%20(1)%20(1).mp4";
const MOVIE_URL = "https://nothingbuttylermovies.github.io/videos/JennaAndTubers/Jenna%20and%20Tubers%20-%20Mini%20TV%20show%20-%20episode%201%20%23shortvideo%20%23roblox.mp4";
const CIRCUMFERENCE = 220;

/* ELEMENTS */
const adOverlay = document.getElementById("ad-overlay");
const adVideo = document.getElementById("ad-video");
const adPlayContainer = document.getElementById("ad-play-container"); 
const mainPlayer = document.getElementById("main-player");
const timerContainer = document.getElementById("ad-timer-container");
const timerText = document.getElementById("ad-timer");
const timerProgress = document.getElementById("timer-progress");
const controls = document.getElementById("controls");
const overlayTop = document.getElementById("overlay-top");
const progressContainer = document.getElementById("progress-bar-container");
const progressFill = document.getElementById("progress-fill");
const playIcon = document.getElementById("play-icon");
const timeDisplay = document.getElementById("time-display");
const settingsMenu = document.getElementById("settings-menu");
  
const nextOverlay = document.getElementById("next-episode-overlay");
const countdownEl = document.getElementById("countdown");
  
  let adMode = "tap"; 
// "tap" = waiting for user
// "playing" = ad is playing
// "ended" = ad finished

let nextTriggered = false;
let nextCanceled = false;
let countdownInterval = null;

/* STATE */
let started = false;
let adFinished = false;
let controlsTimeout;

/* INIT */
window.addEventListener("load", () => {
  adOverlay.style.display = "flex";

  const adControls = document.getElementById("ad-controls");

  // ✅ Only tap is active
  adControls.style.display = "none";
  adControls.style.pointerEvents = "none";

  adPlayContainer.style.display = "flex";
  adPlayContainer.style.pointerEvents = "auto";

  adVideo.src = AD_URL;
  mainPlayer.src = MOVIE_URL;

  const savedTheme = localStorage.getItem("theme") || "blue";
  setTheme(savedTheme);
});

/* 1. START PLAYBACK */
function startPlayback() {
  if (started) return;
  started = true;

  adMode = "playing";

  // ❌ Disable tap UI completely
  adPlayContainer.style.display = "none";
  adPlayContainer.style.pointerEvents = "none";

  // ✅ Enable ad controls
  const adControls = document.getElementById("ad-controls");
  adControls.style.display = "flex";
  adControls.style.pointerEvents = "auto";

  // Unlock main player
  mainPlayer.play().then(() => {
    mainPlayer.pause();
  });

  // Start ad
  adVideo.style.opacity = "1";
  adVideo.muted = false;

  adVideo.play().then(() => {
    timerContainer.style.display = "flex";
  }).catch(() => {
    adVideo.dispatchEvent(new Event("ended"));
  });




  // 3. Start the Ad
  adVideo.style.opacity = "1";
  adVideo.muted = false;

  adVideo.play().then(() => {
    timerContainer.style.display = "flex";
  }).catch((err) => {
    console.error("Ad blocked", err);
    adVideo.dispatchEvent(new Event('ended'));
  });
}
  
  
  
  /* 2. LISTENERS & TIMER (MISSING PART) */
adPlayContainer.addEventListener("click", () => {
  hideAdTapUI();
  startPlayback();
});

adVideo.addEventListener("timeupdate", () => {
  if (!adVideo.duration) return;
  const remaining = Math.ceil(adVideo.duration - adVideo.currentTime);
  timerText.textContent = remaining;
  const progress = adVideo.currentTime / adVideo.duration;
  timerProgress.style.strokeDashoffset = CIRCUMFERENCE - progress * CIRCUMFERENCE;
});
  
  const skipButtons = document.getElementById("skip-buttons");


  // (Optional recap — currently none)
  
    

// time update listener
  
  mainPlayer.addEventListener("timeupdate", () => {
  if (!adFinished) return;

  const t = mainPlayer.currentTime;

  if (t >= INTRO_START && t <= INTRO_END) {
    skipButtons.style.display = "flex";
  } else {
    skipButtons.style.display = "none";
  }
});

  



  // 🔥 HARD DISABLE EVERYTHING AD RELATED
  adPlayContainer.style.display = "none";
  adPlayContainer.style.pointerEvents = "none";

  const adControls = document.getElementById("ad-controls");
  adControls.style.display = "none";
  adControls.style.pointerEvents = "none";

  timerContainer.style.display = "none";

  mainPlayer.style.zIndex = "10";
  mainPlayer.muted = false;
  mainPlayer.currentTime = 0;

  mainPlayer.play().then(() => {
    showControls();
  });



/* PLAYER CONTROLS */
function togglePlay() { 
  mainPlayer.paused ? mainPlayer.play() : mainPlayer.pause(); 
}

mainPlayer.addEventListener("play", () => { 
  playIcon.className = "fa-solid fa-pause"; 
  showControls(); 
});
  
  mainPlayer.addEventListener("play", () => {
  nextEpisodeCancelled = false;
});

mainPlayer.addEventListener("pause", () => { 
  playIcon.className = "fa-solid fa-play"; 
  showControls(); 
});
  
mainPlayer.addEventListener("ended", () => {
  showEndScreen();
});

function showControls() {
  if (!adFinished) return;

  controls.classList.add("active");
  overlayTop.classList.add("active");

  clearTimeout(controlsTimeout);

  controlsTimeout = setTimeout(() => {
    if (!mainPlayer.paused && !settingsMenu.classList.contains("visible")) {
      controls.classList.remove("active");
      overlayTop.classList.remove("active");
    }
  }, 3000);
}

function hideControls() {
  if (settingsMenu.classList.contains("visible")) return;
  controls.classList.remove("active");
  overlayTop.classList.remove("active");
}

document.addEventListener("mousemove", () => {
  if (!adFinished) return;
  showControls();
});

document.addEventListener("touchstart", () => {
  if (!adFinished) return;
  showControls();
});

/* TIME + PROGRESS */
function formatTime(sec) {
  if (!sec || isNaN(sec)) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

mainPlayer.addEventListener("timeupdate", () => {
  if (!mainPlayer.duration) return;

  const percent = (mainPlayer.currentTime / mainPlayer.duration) * 100;
  progressFill.style.width = percent + "%";

  timeDisplay.textContent =
    `${formatTime(mainPlayer.currentTime)} / ${formatTime(mainPlayer.duration)}`;
});

progressContainer.addEventListener("click", e => {
  const rect = progressContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  mainPlayer.currentTime = percent * mainPlayer.duration;
});

/* SETTINGS */
function toggleSettings() {
  if (!adFinished) return; // Block settings during ad
  settingsMenu.classList.toggle("visible");
  
  if (settingsMenu.classList.contains("visible")) {
    clearTimeout(controlsTimeout);
    controls.classList.add("active");
    overlayTop.classList.add("active");
  } else {
    showControls();
  }
}

function closeSettings() { 
  settingsMenu.classList.remove("visible"); 
  showControls();
}

function setTheme(theme) {
  document.body.classList.remove("theme-red", "theme-green");
  if (theme === "red") document.body.classList.add("theme-red");
  if (theme === "green") document.body.classList.add("theme-green");
  localStorage.setItem("theme", theme);
}

function restartVideo() { 
  mainPlayer.currentTime = 0; 
  mainPlayer.play(); 
  closeSettings();
}

function goFullScreen() {
  const wrapper = document.getElementById("video-wrapper");
  if (!document.fullscreenElement) wrapper.requestFullscreen();
  else document.exitFullscreen();
}
  
  
  // Next Episode Overlay
  
const endScreen = document.getElementById("end-screen");
const endCountdownEl = document.getElementById("end-countdown");

let endCountdown = 10;
let endInterval = null;
let endCancelled = false;
  
  /* Next screen */
  
  function showEndScreen() {
  endScreen.style.display = "flex";
  endCountdown = 10;
  endCancelled = false;

  endCountdownEl.textContent = endCountdown;

  endInterval = setInterval(() => {
    if (endCancelled) return;

    endCountdown--;
    endCountdownEl.textContent = endCountdown;

    if (endCountdown <= 0) {
      clearInterval(endInterval);
      goToNextEpisode();
    }
  }, 1000);
}

  // Save progress Script
  
  function saveProgress() {
  localStorage.setItem("progress-" + MOVIE_URL, mainPlayer.currentTime);
}

// Save during playback (throttled)
let lastSave = 0;
mainPlayer.addEventListener("timeupdate", () => {
  const now = Date.now();
  if (now - lastSave > 1000) {
    saveProgress();
    lastSave = now;
  }
});

// Save when pausing
mainPlayer.addEventListener("pause", saveProgress);

// Save when leaving page
window.addEventListener("beforeunload", saveProgress);
  
  mainPlayer.addEventListener("loadedmetadata", () => {
  timeDisplay.textContent = `0:00 / ${formatTime(mainPlayer.duration)}`;

  const savedTime = localStorage.getItem("progress-" + MOVIE_URL);

  if (savedTime && parseFloat(savedTime) < mainPlayer.duration - 5) {
    mainPlayer.currentTime = parseFloat(savedTime);
  }
});
  
  
// Loading screen redirect to next episode
  


mainPlayer.addEventListener("timeupdate", () => {
  if (!adFinished) return; // 🚫 BLOCK during ads
  if (!mainPlayer.duration) return;
  if (mainPlayer.paused) return; // 🚫 BLOCK when paused

  const timeLeft = mainPlayer.duration - mainPlayer.currentTime;

  if (timeLeft <= 10 && !nextTriggered && !nextCanceled) {
    startNextEpisodeCountdown();
  }
});



function cancelNextEpisode() {

  nextTriggered = true;

  clearInterval(countdownInterval);
  
}

  // Rewind/Fast Forwarding Script
  
  function seekBackward() {
  mainPlayer.pause();
  mainPlayer.currentTime = Math.max(0, mainPlayer.currentTime - 10);
}

function seekForward() {
  mainPlayer.pause();
  mainPlayer.currentTime = Math.min(mainPlayer.duration, mainPlayer.currentTime + 10);
}

// Preview Seek Logic
  
  /* KEYBOARD CONTROLS & SEEK PREVIEW */
const seekPreview = document.getElementById("seek-preview");
const previewTimeDisplay = document.getElementById("preview-time");
let isSeeking = false;
let tempSeekTime = 0;

document.addEventListener("keydown", (e) => {
  if (!adFinished) return; // Block during ads

  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    if (!isSeeking) {
      isSeeking = true;
      tempSeekTime = mainPlayer.currentTime;
      mainPlayer.pause(); // Pause while they "scrub"
      seekPreview.style.display = "block";
    }

    const step = 5; // seconds per tap
    if (e.key === "ArrowLeft") tempSeekTime = Math.max(0, tempSeekTime - step);
    if (e.key === "ArrowRight") tempSeekTime = Math.min(mainPlayer.duration, tempSeekTime + step);

    previewTimeDisplay.textContent = formatTime(tempSeekTime);
  }

  if (e.key === " " || e.key === "Enter") {
    if (isSeeking) {
      mainPlayer.currentTime = tempSeekTime;
      isSeeking = false;
      seekPreview.style.display = "none";
      mainPlayer.play();
    } else {
      togglePlay();
    }
  }
});

// 2. Real Working Captions Settings
  
  // a. Font size Changer
  
  let captionSize = 16;

function changeCaptionSize() {
  captionSize += 2;
  if (captionSize > 28) captionSize = 14;

  document.styleSheets[0].insertRule(`
    video::cue {
      font-size: ${captionSize}px;
    }
  `, document.styleSheets[0].cssRules.length);
}
  
  // b. Background toggle
  
  let bgDark = true;

function changeCaptionBg() {
  bgDark = !bgDark;

  const bg = bgDark ? "rgba(0,0,0,0.7)" : "transparent";

  document.styleSheets[0].insertRule(`
    video::cue {
      background: ${bg};
    }
  `, document.styleSheets[0].cssRules.length);
}
  
  // c. Opacity control
  
  let opacity = 0.7;

function changeCaptionOpacity() {
  opacity -= 0.2;
  if (opacity < 0.2) opacity = 1;

  document.styleSheets[0].insertRule(`
    video::cue {
      background: rgba(0,0,0,${opacity});
    }
  `, document.styleSheets[0].cssRules.length);
}
  
  // d. font Family switcher
  
  let fontIndex = 0;
const fonts = ["Inter", "Arial", "Courier New"];

function changeCaptionFont() {
  fontIndex = (fontIndex + 1) % fonts.length;

  document.styleSheets[0].insertRule(`
    video::cue {
      font-family: ${fonts[fontIndex]};
    }
  `, document.styleSheets[0].cssRules.length);
}
  
  // e. save settings script
  
  localStorage.setItem("captionSize", captionSize);
localStorage.setItem("captionFont", fonts[fontIndex]);

  } else {
    textTrack.mode = "showing";
  }
}
